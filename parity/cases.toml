# Matriz de paridade do Caronte: `hades caronte ...` (TS, Hades-Skill) contra o binário `caronte`.
# O argv é o do binário; o lado TS ganha o subcomando `caronte` por `ts_cmd`.
# Fixture `orq`: plano demo, agente fake-a e a worktree montada pelos `setup-orq*.sh` (segredo montado no setup).
# Pacote gravado não se compara em bytes (sal, IV e gzip diferem): `pack.grava` compara saída e código; modo 600 e
# conteúdo ficam nos testes do Rust. O tty da senha fica fora da matriz (PR 8).

[[case]]
id = "uso.sem-sub"
argv = []
ts_cmd = ["{skill}/src/cli.ts", "caronte"]
env = { HADES_NOW = "2026-11-20T12:00:00Z", HADES_CARONTE_SCRYPT_LOG2N = "14", HADES_CARONTE_PASSWORD = "senha de teste 123" }
compare = ["stdout", "stderr", "exit"]

