# unpack: HADES_MODEL_IMPL/HADES_EFFORT_IMPL fixos: o runner exporta HADES_DATA e o core Rust (regra de instância unificada) deixa de ler o kit do TS.
# unpack: destinos relativos ao HOME (o runner não troca @HOME@ no argv). Pacotes fixos de gen-pacotes.sh.
# Recusas não comparam stderr (lacuna transversal do catálogo human-errors); o sucesso compara.

[[case]]
id = "unpack.ts-pacote"
argv = ["unpack", "pacotes/ts.caronte", "--work-root", "work", "--plans", "plans", "--worktrees", "trees", "--clone", "clone"]
ts_cmd = ["{skill}/src/cli.ts", "caronte"]
fixture = "unpack"
setup = "setup-unpack.sh"
env = { HADES_NOW = "2026-11-20T12:00:00Z", HADES_CARONTE_SCRYPT_LOG2N = "14", HADES_MODEL_IMPL = "claude-sonnet-5-5", HADES_EFFORT_IMPL = "medium", HADES_CARONTE_PASSWORD = "senha de teste 123" }
compare = ["stdout", "stderr", "exit", "files:trees/**", "files:plans/**", "files:work/**", "files:clone/.git/refs/heads/**"]

